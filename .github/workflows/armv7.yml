name: Build llama.cpp for ARMv7

on:
  workflow_dispatch: # امکان اجرای دستی از تب Actions
  push:
    branches: [ main, master ] # با هر پوش به شاخه اصلی اجرا می‌شود
    paths:
      - '.github/workflows/build-armv7.yml'
      - 'CMakeLists.txt'
      - 'ggml/**'
      - 'src/**'

jobs:
  build-armv7:
    runs-on: ubuntu-22.04 # استفاده از اوبونتو پایدار برای Cross-Compile

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross-Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          cmake \
          ninja-build \
          git

    - name: Configure CMake for ARMv7
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=arm \
          -DGGML_NATIVE=OFF \
          -DGGML_CPU_ARM_ARCH="armv7-a+neon" \
          -DGGML_USE_LLAMAFILE=OFF \
          -DLLAMA_PORTABLE=1 \
          -DGGML_OPENMP=OFF

    - name: Build llama.cpp
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Package Artifacts
      run: |
        mkdir -p artifact/bin
        # کپی کردن فایل‌های اجرایی اصلی
        cp build/bin/llama-cli artifact/bin/ 2>/dev/null || true
        cp build/bin/llama-server artifact/bin/ 2>/dev/null || true
        cp build/bin/llama-bench artifact/bin/ 2>/dev/null || true
        # کپی کردن کتابخانه‌های اشتراکی در صورت وجود
        cp build/bin/*.so artifact/bin/ 2>/dev/null || true
        # ساخت فایل زیپ
        cd artifact && zip -r ../llama-armv7-build.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-armv7-binaries
        path: llama-armv7-build.zip
        retention-days: 5
