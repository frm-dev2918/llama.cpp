name: Build llama.cpp for ARMv7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-armv7:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross-Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          cmake \
          ninja-build \
          git

    # این مرحله جدید است تا باگ FP16 را دور بزند
    - name: Disable llamafile for ARMv7
      run: |
        # حذف ماژول llamafile از فایل CMake اصلی
        sed -i '/ggml-cpu\/llamafile\/sgemm.cpp/d' ggml/src/CMakeLists.txt
        # اطمینان از اینکه فلگ های مربوطه خاموش هستند
        sed -i 's/ggml_add_cpu_backend_variant(.* llamafile.*/ggml_add_cpu_backend_variant(FALSE)/g' ggml/src/CMakeLists.txt || true

    - name: Configure CMake for ARMv7
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=arm \
          -DGGML_NATIVE=OFF \
          -DGGML_CPU_ARM_ARCH="armv7-a+neon" \
          -DGGML_OPENMP=OFF \
          -DGGML_CCACHE=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF

    - name: Build llama.cpp
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Package Artifacts
      run: |
        mkdir -p artifact/bin
        cp build/bin/llama-cli artifact/bin/ 2>/dev/null || true
        cp build/bin/llama-server artifact/bin/ 2>/dev/null || true
        cp build/bin/llama-bench artifact/bin/ 2>/dev/null || true
        cp build/bin/*.so artifact/bin/ 2>/dev/null || true
        cd artifact && zip -r ../llama-armv7-build.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-armv7-binaries
        path: llama-armv7-build.zip
        retention-days: 5
