name: Build llama.cpp with Vulkan + OpenBLAS + AVX2

on:
  workflow_dispatch: # امکان اجرای دستی از تب Actions
  push:
    tags:
      - 'v*'

jobs:
  build:
    # استفاده از آخرین نسخه پایدار اوبونتو
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Vulkan, OpenBLAS, build tools)
        run: |
          # آپدیت کامل مخازن
          sudo apt-get update -y
          sudo apt-get upgrade -y
          
          # نصب پیش‌نیازهای کامپایل، Vulkan (شامل SPIRV-Headers) و OpenBLAS
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libvulkan-dev \
            vulkan-tools \
            glslc \
            glslang-tools \
            spirv-headers \
            libopenblas-dev \
            liblapack-dev \
            pkg-config

      - name: Configure CMake (Optimized for i5-5200U + HD 5500)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=OpenBLAS \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_F16C=ON \
            -DGGML_FMA=ON \
            -DLLAMA_CURL=OFF

      - name: Build
        run: |
          # استفاده از تمام هسته‌های سرور گیت‌هاب برای کامپایل سریع‌تر
          cmake --build build --config Release -j $(nproc)

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp -r build/bin/* artifacts/
          cd artifacts && zip -r ../llama-vulkan-openblas-avx2.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-openblas-avx2
          path: llama-vulkan-openblas-avx2.zip
          retention-days: 5
